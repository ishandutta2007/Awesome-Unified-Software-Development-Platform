<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatParticle {
        0% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-15px) scale(1.1); opacity: 0.7; }
        100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      }

      @keyframes pulseGlow {
        0% { opacity: 0.4; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.4; transform: scale(0.98); }
      }

      @keyframes flowLine {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      .animated-bg-circle {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }

      .floating-particle-1 { animation: floatParticle 5s ease-in-out infinite; }
      .floating-particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
      .floating-particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }

      .flow-path {
        stroke-dasharray: 10 15;
        animation: flowLine 15s linear infinite;
      }

      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 40px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }

      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #cbd5e1;
      }

      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e0e7ff;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Pattern Overlay in Background -->
  <g opacity="0.08">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200 M0 320H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0V360 M200 0V360 M300 0V360 M400 0V360 M500 0V360 M600 0V360 M700 0V360 M800 0V360 M900 0V360 M1000 0V360 M1100 0V360" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Background Dynamic Glowing Orbs (Behind Content) -->
  <circle cx="150" cy="80" r="140" fill="#4f46e5" opacity="0.25" class="animated-bg-circle" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="160" fill="#c084fc" opacity="0.2" class="animated-bg-circle" filter="url(#glow)" />

  <!-- Animated Flow Lines in Side Margins -->
  <path d="M 50 300 C 200 340, 300 280, 400 320" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.4" class="flow-path" />
  <path d="M 800 40 C 950 10, 1050 80, 1150 30" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.4" class="flow-path" />

  <!-- Floating Particles in Background Sides -->
  <circle cx="90" cy="220" r="6" fill="#818cf8" class="floating-particle-1" />
  <circle cx="1110" cy="110" r="8" fill="#f472b6" class="floating-particle-2" />
  <circle cx="1020" cy="60" r="5" fill="#38bdf8" class="floating-particle-3" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#accent-grad)" />

  <!-- Central Glassmorphic Card Container (Ensures Crisp Text Separation) -->
  <rect x="75" y="45" width="1050" height="270" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />

  <!-- Foreground Pill Badges (Placed above main text cleanly) -->
  <g transform="translate(105, 75)">
    <rect width="130" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1" />
    <text x="65" y="18" text-anchor="middle" class="badge-text">🚀 DevOps &amp; SCM</text>

    <g transform="translate(142, 0)">
      <rect width="130" height="28" rx="14" fill="#4c1d95" stroke="#a855f7" stroke-width="1" />
      <text x="65" y="18" text-anchor="middle" class="badge-text">⚡ CI/CD Pipelines</text>
    </g>

    <g transform="translate(284, 0)">
      <rect width="155" height="28" rx="14" fill="#831843" stroke="#ec4899" stroke-width="1" />
      <text x="77" y="18" text-anchor="middle" class="badge-text">📊 Project Management</text>
    </g>
  </g>

  <!-- Title & Subtitle in Foreground (Clear & Unobscured) -->
  <text x="105" y="160" class="title-text">Awesome Unified Software Development Platform 🛠️</text>
  <text x="105" y="200" class="subtitle-text">Curated directory of enterprise SaaS solutions &amp; powerful open-source platforms</text>
  <text x="105" y="228" class="subtitle-text" opacity="0.8">Empowering engineering teams with integrated source code hosting, CI/CD, GitOps &amp; Agile delivery.</text>

  <!-- Bottom Metric Highlights Inside Card -->
  <g transform="translate(105, 260)">
    <circle cx="8" cy="8" r="5" fill="#22c55e" />
    <text x="22" y="12" fill="#94a3b8" font-family="system-ui" font-size="13" font-weight="500">Updated October 2026</text>

    <circle cx="180" cy="8" r="5" fill="#6366f1" />
    <text x="194" y="12" fill="#94a3b8" font-family="system-ui" font-size="13" font-weight="500">10 Enterprise SaaS Leaders</text>

    <circle cx="380" cy="8" r="5" fill="#a855f7" />
    <text x="394" y="12" fill="#94a3b8" font-family="system-ui" font-size="13" font-weight="500">19 Top Open-Source Projects</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="75" y="313" width="1050" height="2" fill="url(#accent-grad)" opacity="0.7" />
</svg>
